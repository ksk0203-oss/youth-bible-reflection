<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>전체 목록 · Youth Bible Reflection</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="청소년 묵상">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <div class="fs-control" id="fs-control">
    <span class="fs-label">글씨 크기</span>
    <button class="fs-btn" data-scale="0.9" onclick="setFontScale(0.9)">가</button>
    <button class="fs-btn fs-active" data-scale="1" onclick="setFontScale(1)">가</button>
    <button class="fs-btn" data-scale="1.15" onclick="setFontScale(1.15)">가</button>
    <button class="fs-btn" data-scale="1.3" onclick="setFontScale(1.3)">가</button>
  </div>

  <div class="hero">
    <div class="hero-inner">
      <div class="hero-badge">청소년 5분 말씀 묵상</div>
      <div class="hero-title">전체 목록</div>
      <div class="hero-sub">로마서 파헤치기 · 지금까지의 모든 날짜</div>
    </div>
  </div>

  <div class="badge-row"><span class="pill-badge">날짜를 눌러 그날의 묵상을 읽어보세요</span></div>

  <div id="list-container"></div>

  <div class="footer-links"><a href="index.html">&larr; 처음으로 돌아가기</a></div>
  <div class="footer-note">청소년부 · 로마서 파헤치기</div>
</div>

<button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" aria-label="맨 위로"><span>↑</span></button>

<script src="js/app.js"></script>
<script>
async function init() {
  const container = document.getElementById('list-container');
  let posts;
  try {
    posts = await loadPosts('data/posts.json');
  } catch (e) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">목록을 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div></div>';
    return;
  }

  if (!posts.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">아직 등록된 묵상이 없어요.</div></div>';
    return;
  }

  // 연/월별로 그룹화
  const groups = {};
  posts.forEach(p => {
    const key = `${p.year}-${String(p.month).padStart(2,'0')}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  const sortedKeys = Object.keys(groups).sort();
  let html = '';
  sortedKeys.forEach(key => {
    const [y, m] = key.split('-');
    html += `<div class="month-label">${y}년 ${parseInt(m)}월</div>`;
    html += '<div class="toc-card">';
    groups[key].sort((a,b) => a.day - b.day).forEach(p => {
      const dow = getWeekdayLabel(p.year, p.month, p.day);
      if (p.ready) {
        html += `
          <a class="toc-item" href="posts/detail.html?id=${p.id}">
            <span class="toc-date-num">${p.date_label}<span class="toc-dow">(${dow})</span></span>
            <span class="toc-ref">롬 ${p.ref}</span>
            <span class="toc-theme-text">${p.theme}</span>
            <span class="toc-tag">보기</span>
            <span class="toc-arrow">›</span>
          </a>`;
      } else {
        html += `
          <div class="toc-item is-disabled">
            <span class="toc-date-num">${p.date_label}<span class="toc-dow">(${dow})</span></span>
            <span class="toc-ref">롬 ${p.ref || ''}</span>
            <span class="toc-theme-text">${p.theme || '준비중이에요'}</span>
            <span class="toc-tag soon">준비중</span>
            <span class="toc-arrow"></span>
          </div>`;
      }
    });
    html += '</div>';
  });

  container.innerHTML = html;
}
init();
</script>
</body>
</html>
