<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>오늘의 묵상 · Youth Bible Reflection</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#7C5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="청소년 묵상">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="wrap">

  <div class="fs-control" id="fs-control">
    <span class="fs-label">글씨 크기</span>
    <button class="fs-btn" data-scale="0.9" onclick="setFontScale(0.9)">가</button>
    <button class="fs-btn fs-active" data-scale="1" onclick="setFontScale(1)">가</button>
    <button class="fs-btn" data-scale="1.15" onclick="setFontScale(1.15)">가</button>
    <button class="fs-btn" data-scale="1.3" onclick="setFontScale(1.3)">가</button>
  </div>

  <a class="back-link" href="../archive.html">&larr; 전체 목록으로</a>

  <div id="content-container">
    <div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">불러오는 중이에요...</div></div>
  </div>

</div>

<button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" aria-label="맨 위로"><span>↑</span></button>

<script src="../js/app.js"></script>
<script>
async function init() {
  const container = document.getElementById('content-container');
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">잘못된 주소예요.<br>목록에서 다시 선택해주세요.</div></div>';
    return;
  }

  let posts;
  try {
    posts = await loadPosts('../data/posts.json');
  } catch (e) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">내용을 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div></div>';
    return;
  }

  const post = posts.find(p => p.id === id);
  if (!post || !post.ready) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🚧</div><div class="empty-text">아직 준비중인 날짜예요.</div></div>';
    return;
  }

  document.title = post.theme + ' · Youth Bible Reflection';
  currentPost = post;

  const idx = posts.filter(p => p.ready).findIndex(p => p.id === id);
  const readyPosts = posts.filter(p => p.ready);
  const next = readyPosts[idx + 1];

  container.innerHTML = `
    <div class="day-card">
      <div class="day-header-row">
        <div class="day-num-chip">${String(post.day).padStart(2,'0')}</div>
        <div class="day-date-label">${post.month}월 ${post.day}일 · 로마서 ${post.ref}</div>
      </div>

      <div class="audio-row">
        <button class="audio-play-btn" id="audio-play-btn" onclick="togglePlay()"><span id="audio-play-icon">▶</span></button>
        <div class="audio-status" id="audio-status">듣기</div>
        <div class="audio-speed-group">
          <button class="speed-btn is-active" data-rate="1" onclick="setRate(1)">1x</button>
          <button class="speed-btn" data-rate="1.25" onclick="setRate(1.25)">1.25x</button>
          <button class="speed-btn" data-rate="1.5" onclick="setRate(1.5)">1.5x</button>
        </div>
      </div>

      <div class="day-title">${post.theme}</div>

      <div class="scripture-box">${post.scripture}</div>
      ${post.note ? `<div class="scripture-note">${post.note}</div>` : ''}

      <div class="section-block"><span class="chip chip--med">묵상</span><div class="section-text">${post.meditation}</div></div>
      <div class="section-block"><span class="chip chip--app">적용</span><div class="section-text">${post.application}</div></div>
      <div class="section-block"><span class="chip chip--pray">기도</span><div class="section-text">${post.prayer}</div></div>

      <div class="nav-row">
        <a href="../archive.html">&larr; 목록으로</a>
        <span>${next ? `다음: ${next.date_label}` : '마지막 날이에요'}</span>
      </div>
    </div>
  `;
}
init();
</script>
</body>
</html>
