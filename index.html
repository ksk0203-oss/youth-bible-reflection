<meta property="og:site_name" content="Youth Bible Reflection">
<meta property="og:title" content="청소년 5분 말씀 묵상 - 로마서 파헤치기">
<meta property="og:description" content="대전성은교회 청소년부 - 하루 5분이면 충분해요. 로마서를 청소년 눈높이로 풀어드립니다.">
<meta property="og:image" content="https://ksk0203-oss.github.io/youth-bible-reflection/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ksk0203-oss.github.io/youth-bible-reflection/">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="청소년 묵상">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">
<style>
.month-card-row { display:flex; gap:10px; }
.month-card { flex:1; text-decoration:none; aspect-ratio: 3/4; display:block; }
.month-card-inner {
  border-radius:22px; padding:20px 18px; height:100%; box-sizing:border-box;
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 8px 20px rgba(124,92,255,0.28); position:relative; overflow:hidden;
}
.month-card-deco { position:absolute; top:-30px; right:-30px; width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,0.12); }
.month-card-top, .month-card-bottom { position:relative; z-index:1; }
.month-card-year { color:rgba(255,255,255,0.9); font-size:14px; font-weight:700; }
.month-card-num { color:var(--white); font-size:38px; font-weight:900; line-height:1.1; margin-top:4px; }
.month-card-range { color:rgba(255,255,255,0.95); font-size:14.5px; font-weight:700; line-height:1.6; }
.month-card-cta { color:var(--white); font-size:15px; font-weight:800; margin-top:10px; }
@media (max-width: 480px) {
  .month-card-row { gap: 8px; }
  .month-card-inner { padding: 14px 12px; border-radius: 18px; }
  .month-card-year { font-size: 11px; }
  .month-card-num { font-size: 26px; margin-top: 2px; }
  .month-card-range { font-size: 11px; line-height: 1.5; }
  .month-card-cta { font-size: 12px; margin-top: 6px; }
}
</style>
</head>
<body>

<div class="wrap">

  <div class="fs-control" id="fs-control">
    <span class="fs-label">글씨 크기</span>
    <button class="fs-btn" data-scale="0.9" onclick="setFontScale(0.9)">가</button>
    <button class="fs-btn fs-active" data-scale="1" onclick="setFontScale(1)">가</button>
    <button class="fs-btn" data-scale="1.15" onclick="setFontScale(1.15)">가</button>
    <button class="fs-btn" data-scale="1.3" onclick="setFontScale(1.3)">가</button>
  </div>

  <div class="hero">
    <div class="hero-inner">
      <div class="hero-badge">청소년 5분 말씀 묵상</div>
      <div class="hero-title">로마서 파헤치기</div>
      <div class="hero-sub">하루 5분이면 충분해요</div>
      <div class="hero-verse">
        "주의 말씀은 내 발에 등이요 내 길에 빛이니이다"
        <span class="hero-verse-ref">— 시편 119:105</span>
      </div>
    </div>
  </div>

  <div id="month-grid-container"></div>

  <div class="footer-note" style="margin-top:24px;">청소년부 · 로마서 파헤치기</div>
</div>

<button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" aria-label="맨 위로"><span>↑</span></button>

<script src="js/app.js"></script>
<script>
async function init() {
  const container = document.getElementById('month-grid-container');
  let posts;
  try {
    posts = await loadPosts('data/posts.json');
  } catch (e) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">목록을 불러오지 못했습니다.</div></div>';
    return;
  }

  const monthKeys = [...new Set(posts.map(p => `${p.year}-${String(p.month).padStart(2,'0')}`))].sort();
  const cardGradients = [
    'linear-gradient(160deg, var(--purple) 0%, #5B3FD9 100%)',
    'linear-gradient(160deg, var(--pink) 0%, var(--orange) 100%)',
    'linear-gradient(160deg, var(--mint) 0%, #2E9E96 100%)',
  ];

  let html = '<div class="month-label">묵상 목록</div><div class="month-card-row">';
  monthKeys.forEach((key, i) => {
    const [y, m] = key.split('-');
    const monthPosts = posts.filter(p => `${p.year}-${String(p.month).padStart(2,'0')}` === key)
                             .sort((a,b) => a.day - b.day);
    const first = monthPosts[0];
    const last = monthPosts[monthPosts.length - 1];
    const startChapVerse = first.ref.split(/[–-]/)[0];
    const endChapVerse = last.ref.includes(':') && last.ref.split(':')[0] !== undefined
      ? `${last.ref.split(':')[0]}:${last.ref.split(/[–-]/).pop()}`
      : last.ref;
    const gradient = cardGradients[i % cardGradients.length];

    html += `
      <a href="archive.html?month=${key}" class="month-card">
        <div class="month-card-inner" style="background:${gradient};">
          <div class="month-card-deco"></div>
          <div class="month-card-top">
            <div class="month-card-year">${y}</div>
            <div class="month-card-num">${parseInt(m)}월</div>
          </div>
          <div class="month-card-bottom">
            <div class="month-card-range">로마서<br>${startChapVerse} ~ ${endChapVerse}</div>
            <div class="month-card-cta">보러가기 →</div>
          </div>
        </div>
      </a>`;
  });
  html += '</div>';
  container.innerHTML = html;
}
init();
</script>
</body>
</html>
