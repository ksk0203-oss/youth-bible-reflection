<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Youth Bible Reflection</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="청소년 묵상">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <div class="fs-control" id="fs-control">
    <span class="fs-label">글씨 크기</span>
    <button class="fs-btn" data-scale="0.9" onclick="setFontScale(0.9)">가</button>
    <button class="fs-btn fs-active" data-scale="1" onclick="setFontScale(1)">가</button>
    <button class="fs-btn" data-scale="1.15" onclick="setFontScale(1.15)">가</button>
    <button class="fs-btn" data-scale="1.3" onclick="setFontScale(1.3)">가</button>
  </div>

  <div class="hero">
    <div class="hero-inner">
      <div class="hero-badge">청소년 5분 말씀 묵상</div>
      <div class="hero-title">로마서 파헤치기</div>
      <div class="hero-sub">하루 5분이면 충분해요</div>
      <div class="hero-verse">
        "주의 말씀은 내 발에 등이요 내 길에 빛이니이다"
        <span class="hero-verse-ref">— 시편 119:105</span>
      </div>
    </div>
  </div>

  <div id="latest-container"></div>

  <div class="badge-row" style="margin-top:16px;">
    <a class="pill-badge" href="archive.html" style="text-decoration:none;">전체 목록 보러가기 →</a>
  </div>

  <div class="footer-note" style="margin-top:24px;">청소년부 · 로마서 파헤치기</div>
</div>

<button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" aria-label="맨 위로"><span>↑</span></button>

<script src="js/app.js"></script>
<script>
async function init() {
  const container = document.getElementById('latest-container');
  let posts;
  try {
    posts = await loadPosts('data/posts.json');
  } catch (e) {
    return;
  }
  const ready = posts.filter(p => p.ready);
  if (!ready.length) return;
  const latest = ready[ready.length - 1];
  const dow = getWeekdayLabel(latest.year, latest.month, latest.day);

  container.innerHTML = `
    <div class="month-label">최신 묵상</div>
    <div class="toc-card">
      <a class="toc-item" href="posts/detail.html?id=${latest.id}">
        <span class="toc-date-num">${latest.date_label}<span class="toc-dow">(${dow})</span></span>
        <span class="toc-ref">롬 ${latest.ref}</span>
        <span class="toc-theme-text">${latest.theme}</span>
        <span class="toc-tag">보기</span>
        <span class="toc-arrow">›</span>
      </a>
    </div>
  `;
}
init();
</script>
</body>
</html>
